name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Kiểu + test (PGlite) + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  postgres:
    name: Test với PostgreSQL 16
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test -w backend

  data-service:
    name: Test data-service (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: data-service/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -t .

  docker:
    name: Build image Docker + kiểm tra khởi động
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: vnstock-sim:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Chạy thử image (PGlite) và gọi /api/health
        run: |
          docker run -d --name app -p 4000:4000 \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            -e PUBLIC_URL=http://localhost:4000 \
            -e ADMIN_EMAIL=admin@ci.test -e ADMIN_PASSWORD=ci-admin-12345 \
            vnstock-sim:ci
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:4000/api/health; then
              curl -fsS -o /dev/null http://localhost:4000/ && echo && echo "OK" && exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1
      - name: Build image data-service
        run: docker build -t vnstock-data:ci data-service
