# VNStock Sim — chạy production trên 1 máy chủ: PostgreSQL + app + Caddy (HTTPS tự động)
#
#   cp .env.docker.example .env        # điền tên miền, mật khẩu, khoá bí mật
#   docker compose up -d --build       # chạy nền
#   docker compose logs -f app         # xem log
#
# Tuỳ chọn:
#   docker compose --profile backup up -d     # thêm dịch vụ sao lưu Postgres mỗi ngày vào ./backups
#   docker compose --profile vnstock up -d    # thêm data-service lấy giá thật (đặt MARKET_PROVIDER=vnstock)
# Chi tiết: docs/DEPLOY.md

name: vnstock

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: vnstock
      POSTGRES_USER: vnstock
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Đặt POSTGRES_PASSWORD trong file .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vnstock -d vnstock']
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: vnstock-sim:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://vnstock:${POSTGRES_PASSWORD}@db:5432/vnstock
      # Đứng sau 1 proxy (Caddy) → lấy IP thật của người dùng từ X-Forwarded-For
      TRUST_PROXY: '1'
      PORT: '4000'
      VNSTOCK_URL: http://data-service:8001
    # Chỉ mở cho chính máy chủ (để debug bằng curl); người dùng truy cập qua Caddy
    ports:
      - '127.0.0.1:4000:4000'
    # Bản sao lưu tự động trước khi khôi phục (Quản trị → Dữ liệu) được giữ lại khi tạo lại container
    volumes:
      - appdata:/app/backend/data
    stop_grace_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    environment:
      DOMAIN: ${DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  # Giá thật qua API web VCI (chỉ cần khi MARKET_PROVIDER=vnstock)
  data-service:
    profiles: ['vnstock']
    build: ./data-service
    restart: unless-stopped

  # Sao lưu Postgres mỗi ngày (pg_dump định dạng custom, đã nén — khôi phục bằng pg_restore), giữ BACKUP_KEEP_DAYS ngày
  backup:
    profiles: ['backup']
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_INTERVAL_SEC: ${BACKUP_INTERVAL_SEC:-86400}
    volumes:
      - ./backups:/backups
    entrypoint: ['/bin/sh', '-c']
    command:
      - |
        while true; do
          f=/backups/vnstock-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump -h db -U vnstock -Fc --no-owner -f "$$f.tmp" vnstock; then mv "$$f.tmp" "$$f"; echo "[backup] đã lưu $$f"; else rm -f "$$f.tmp"; echo "[backup] LỖI pg_dump"; fi
          find /backups -name 'vnstock-*.dump' -mtime +$${BACKUP_KEEP_DAYS} -delete
          sleep $${BACKUP_INTERVAL_SEC}
        done

volumes:
  pgdata:
  appdata:
  caddy_data:
  caddy_config:
